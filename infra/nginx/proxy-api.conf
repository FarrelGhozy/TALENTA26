# Konfigurasi reverse proxy bersama ke layanan backend API (`api:3001`).
resolver 127.0.0.11 valid=30s ipv6=off;
set $api_upstream http://api:3001;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# Teruskan hanya $remote_addr hasil validasi `set_real_ip_from` dan hapus header spoofing klien.
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Cegah duplikasi header keamanan antara respons Elysia dan snippet security-headers.conf Nginx.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_request_buffering on;
