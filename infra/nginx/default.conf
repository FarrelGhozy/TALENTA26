# ==============================================================================
# TALENTA UNIDA Gontor — Konfigurasi Nginx Reverse Proxy & Proteksi Edge DDoS
# ==============================================================================
# Dijalankan di belakang Cloudflare Tunnel atau reverse proxy privat pada origin tunggal.
# Seluruh permintaan SPA (/) dan API (/api/) melalui Nginx ini dengan pembatasan berjenjang.

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Bebankan `upload_limit` hanya pada metode tulis (POST/PUT) agar GET daftar prestasi/profil tidak tercekik.
map $request_method $upload_limit_key {
  POST    $binary_remote_addr;
  PUT     $binary_remote_addr;
  default "";
}

# Zona pembatasan koneksi dan rate limit berjenjang (ramah NAT Wi-Fi kampus)
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=15r/m;
limit_req_zone  $upload_limit_key   zone=upload_limit:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=health_limit:10m rate=6r/m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Ekstrak IP klien nyata hanya jika permintaan datang dari hop lokal/jaringan privat (cloudflared / Docker)
  set_real_ip_from 127.0.0.1/32;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from ::1/128;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Proteksi koneksi simultan & anti-Slowloris
  limit_conn conn_per_ip 50;
  client_max_body_size 256k;
  client_body_buffer_size 128k;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 15s;
  keepalive_timeout 15s;
  keepalive_requests 100;
  reset_timedout_connection on;

  # Kompresi teks/JSON/JS/CSS/SVG untuk efisiensi bandwidth
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Respons JSON ramah frontend saat Nginx memicu 429 di rute API/health
  location @rate_limited_json {
    default_type application/json;
    add_header Retry-After "60" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Terlalu banyak permintaan dari jaringan Anda. Silakan tunggu sebentar lalu coba lagi."}}';
  }

  # Health check internal Nginx (hanya untuk healthcheck container & loopback/jaringan privat)
  location = /nginx-health {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Probe kesehatan ringan
  location = /health/live {
    error_page 429 = @rate_limited_json;
    limit_req zone=api_limit burst=20 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  # Readiness probe (menjalankan SELECT 1 MySQL — dibatasi ketat di edge)
  location = /health/ready {
    error_page 429 = @rate_limited_json;
    limit_req zone=health_limit burst=4 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  location = /health {
    error_page 429 = @rate_limited_json;
    limit_req zone=api_limit burst=20 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
  }

  # Endpoint autentikasi sensitif (anti brute-force & credential stuffing)
  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
    error_page 429 = @rate_limited_json;
    client_max_body_size 256k;
    limit_req zone=auth_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Unggah & hapus avatar privat (maks berkas 2 MB + overhead multipart => batas edge 3 MB)
  location = /api/v1/me/profile/avatar {
    error_page 429 = @rate_limited_json;
    client_max_body_size 3m;
    client_body_timeout 30s;
    limit_req zone=api_limit burst=30 nodelay;
    limit_req zone=upload_limit burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Unggah bukti prestasi / revisi (maks 3 berkas x 8 MB + overhead multipart => batas edge 26 MB)
  location ~ ^/api/v1/me/achievements(?:/[^/]+/revisions)?$ {
    error_page 429 = @rate_limited_json;
    client_max_body_size 26m;
    client_body_timeout 30s;
    limit_req zone=api_limit burst=60 nodelay;
    limit_req zone=upload_limit burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Seluruh rute REST API lainnya (payload JSON maks 1 MB)
  location /api/ {
    error_page 429 = @rate_limited_json;
    client_max_body_size 1m;
    limit_req zone=api_limit burst=60 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Aset build ber-hash dari Vite (cache jangka panjang)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Aset gambar statis & identitas aplikasi publik
  location /images/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback (index.html tidak di-cache agar rilis terbaru segera termuat)
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
