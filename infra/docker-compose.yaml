# ==============================================================================
# UNIDA Student Championship (USC) — Docker Compose Khusus Production (GHCR)
# ==============================================================================
# Konsep:
# - Docker Compose ini HANYA untuk runtime production di server (tidak melakukan build).
# - Default menarik tag `:latest` dari GHCR; ubah `IMAGE_TAG` di `infra/.env` (atau via env)
#   untuk menyematkan/rollback ke tag rilis tertentu (mis. `v1.0.0` atau `sha-<commit>`).
# - Seluruh konfigurasi runtime production WAJIB diatur pada `infra/.env`
#   (salin dari `../.env.example` lalu sesuaikan DB, RustFS, secret, SMTP, dan PUBLIC_ORIGIN).
# - Secara default `web` bind ke `127.0.0.1:${WEB_PORT:-3350}:80` (FE) dan `api` bind ke
#   `127.0.0.1:${API_PORT:-3360}:3001` (BE) agar target produksi dapat diarahkan ke localhost
#   lalu dibelokkan lewat Cloudflare Tunnel / reverse proxy (override via `WEB_BIND_HOST`/`API_BIND_HOST`).
# - Terhubung ke network eksternal `homelab-net` untuk menjangkau container MySQL existing.
#
# Perintah cepat (dari direktori `infra/`):
#   cp ../.env.example .env && chmod 600 .env   # isi variabel produksi
#   docker compose pull                         # tarik image terbaru dari GHCR
#   docker compose up -d                        # jalankan migrasi, API, dan Nginx proxy
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  default:
  homelab-net:
    external: true

services:
  migrate:
    image: ghcr.io/${GHCR_OWNER:-farrelghozy}/talenta-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["bunx", "prisma", "migrate", "deploy"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - homelab-net

  api:
    image: ghcr.io/${GHCR_OWNER:-farrelghozy}/talenta-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-3360}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - homelab-net

  web:
    image: ghcr.io/${GHCR_OWNER:-farrelghozy}/talenta-frontend:${IMAGE_TAG:-latest}
    environment:
      API_PUBLIC_ORIGIN: "${API_PUBLIC_ORIGIN:-}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3350}:80"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging
    networks:
      - default
