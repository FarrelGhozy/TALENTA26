name: CI & Publish Container Images (GHCR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (Typecheck, Lint, Unit Tests, Production Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test backend/tests/unit

      - name: Production build (no mock / no VITE API secrets)
        run: bun run build

      - name: Scan production bundle & tracked files
        run: |
          if grep -rnE "sertifikat-juara-1-pkm|AdminGontor2026|RoleCardLogin" frontend/dist/; then
            echo "ERROR: Kebocoran artifact demo/mock di frontend/dist!"
            exit 1
          fi
          if git ls-files | grep -E "^\.env($|\.)" | grep -v "^\.env\.example$"; then
            echo "ERROR: File .env ter-track oleh git!"
            exit 1
          fi

  publish-images:
    name: Build & Push Public GHCR Images
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: talenta-frontend
            dockerfile: frontend/Dockerfile
          - image: talenta-backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (SHA & Release tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
